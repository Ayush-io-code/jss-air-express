name: jss_air_express
description: JSS Air Express - Bills Management App
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  provider: ^6.1.1
  shared_preferences: ^2.2.2
  uuid: ^4.3.3
  intl: ^0.19.0
  excel: ^4.0.2
  path_provider: ^2.1.2
  share_plus: ^7.2.2
  file_picker: ^8.0.0+1
  archive: ^3.6.1
  pdf: ^3.10.8
  flutter_slidable: ^3.1.0
  url_launcher: ^6.2.5

  # ── New: Google Drive sync ──────────────────────────────────────────────────
  google_sign_in: ^6.2.1   # handles OAuth 2.0 + token refresh automatically
  http: ^1.2.1             # plain HTTP calls to Drive REST API (no googleapis package needed)

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.1

flutter:
  uses-material-design: true

  assets:
    - assets/fonts/Roboto-Regular.ttf
    - assets/fonts/Roboto-Bold.ttf
